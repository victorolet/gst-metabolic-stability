<svg viewBox="0 0 1520 1080" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1520" height="1080" fill="#ffffff"/>

  <!-- Title -->
  <text x="760" y="30" font-size="23" font-weight="700" text-anchor="middle" fill="#0f172a">GST Metabolic Stability Pipeline — End-to-End Workflow</text>
  <text x="760" y="52" font-size="13" text-anchor="middle" fill="#64748b">AutoDock Vina docking + GROMACS (CHARMM36 / CGenFF) molecular dynamics</text>

  <!-- ============ INPUTS ============ -->
  <rect x="60" y="70" width="380" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="94" font-size="12.5" font-weight="600" text-anchor="middle" fill="#334155">Candidate ligand library</text>
  <text x="250" y="112" font-size="12" text-anchor="middle" fill="#334155">~100 SMILES structures per isoform</text>

  <rect x="460" y="70" width="560" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="740" y="90" font-size="12.5" font-weight="600" text-anchor="middle" fill="#334155">Protein + GSH co-crystal structures (PDB)</text>
  <text x="740" y="107" font-size="12" text-anchor="middle" fill="#334155">GSTA1-1 (1PKW) · GSTM1-1 (3GUR) · GSTP1-1 (1AQW) — single-chain monomers</text>

  <rect x="1040" y="70" width="380" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1230" y="94" font-size="12.5" font-weight="600" text-anchor="middle" fill="#334155">GSH, fixed mol2</text>
  <text x="1230" y="112" font-size="12" text-anchor="middle" fill="#334155">explicit H, correct thiolate protonation state</text>

  <!-- ============ LANE HEADERS ============ -->
  <rect x="60" y="142" width="660" height="22" rx="6" fill="#dbeafe"/>
  <text x="390" y="157" font-size="12" font-weight="700" text-anchor="middle" fill="#1e40af">DOCKING PIPELINE — full ligand library</text>

  <rect x="760" y="142" width="660" height="22" rx="6" fill="#ede9fe"/>
  <text x="1090" y="157" font-size="12" font-weight="700" text-anchor="middle" fill="#5b21b6">MD FORCE-FIELD PREP — protein + GSH + selected ligand</text>

  <!-- ============ ROW A ============ -->
  <rect x="60" y="172" width="320" height="78" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="196" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1e40af">Ligand PDBQT prep</text>
  <text x="220" y="213" font-size="12" text-anchor="middle" fill="#1e40af">SMILES → 3D → PDBQT</text>
  <text x="220" y="230" font-size="12" text-anchor="middle" fill="#1e40af">(meeko, prepare_ligands.py)</text>

  <rect x="400" y="172" width="320" height="78" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="196" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1e40af">Receptor PDBQT prep</text>
  <text x="560" y="213" font-size="12" text-anchor="middle" fill="#1e40af">protein+GSH structure → PDBQT</text>
  <text x="560" y="230" font-size="12" text-anchor="middle" fill="#1e40af">(per isoform)</text>

  <rect x="760" y="172" width="320" height="78" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="920" y="200" font-size="12.5" font-weight="600" text-anchor="middle" fill="#5b21b6">Protein-only PDB</text>
  <text x="920" y="217" font-size="12" text-anchor="middle" fill="#5b21b6">(GSH + HETATM stripped)</text>

  <rect x="1100" y="172" width="320" height="78" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1260" y="200" font-size="12.5" font-weight="600" text-anchor="middle" fill="#5b21b6">GSH fixed mol2</text>
  <text x="1260" y="217" font-size="12" text-anchor="middle" fill="#5b21b6">ready for CGenFF submission</text>

  <!-- ============ ROW B ============ -->
  <rect x="60" y="266" width="660" height="58" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="290" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1e40af">AutoDock Vina docking — per-isoform SLURM array jobs (Setonix)</text>
  <text x="390" y="307" font-size="12" text-anchor="middle" fill="#1e40af">isoform-specific receptor + grid box, full ligand library</text>

  <rect x="760" y="266" width="320" height="58" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="920" y="288" font-size="12.5" font-weight="600" text-anchor="middle" fill="#5b21b6">01_prep_protein.sh</text>
  <text x="920" y="304" font-size="11.5" text-anchor="middle" fill="#5b21b6">pdb2gmx (CHARMM36), charged termini</text>

  <rect x="1100" y="266" width="320" height="58" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1260" y="288" font-size="12.5" font-weight="600" text-anchor="middle" fill="#5b21b6">CGenFF webserver</text>
  <text x="1260" y="304" font-size="12" text-anchor="middle" fill="#5b21b6">→ .str stream file</text>

  <!-- ============ ROW C ============ -->
  <rect x="60" y="340" width="660" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="370" font-size="12.5" text-anchor="middle" fill="#1e40af">Docked poses + Vina affinity scores (per isoform, whole library)</text>

  <rect x="1100" y="340" width="320" height="50" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1260" y="362" font-size="12" font-weight="600" text-anchor="middle" fill="#5b21b6">02_prep_molecule.sh</text>
  <text x="1260" y="378" font-size="11.5" text-anchor="middle" fill="#5b21b6">(cgenff_charmm2gmx.py) → GSH itp/prm</text>

  <!-- ============ ROW D ============ -->
  <rect x="60" y="406" width="660" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="430" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1e40af">Candidate selection</text>
  <text x="390" y="447" font-size="12" text-anchor="middle" fill="#1e40af">Vina score ranking + check_warhead_proximity.py</text>
  <text x="390" y="464" font-size="11.5" text-anchor="middle" fill="#1e40af">(RDKit SMARTS electrophile ID + distance to GSH thiolate S)</text>

  <!-- ============ ROW E ============ -->
  <rect x="60" y="502" width="660" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="528" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1e40af">Selected ligand candidate, per isoform</text>
  <text x="390" y="545" font-size="12" text-anchor="middle" fill="#1e40af">(e.g. lig_03506 / GSTA1-1)</text>

  <rect x="1100" y="502" width="320" height="64" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1260" y="524" font-size="12" font-weight="600" text-anchor="middle" fill="#5b21b6">Selected ligand → CGenFF prep</text>
  <text x="1260" y="540" font-size="11" text-anchor="middle" fill="#5b21b6">(same mol2 → .str → itp/prm route</text>
  <text x="1260" y="554" font-size="11" text-anchor="middle" fill="#5b21b6">as GSH, run for the winner only)</text>

  <!-- ============ MERGE ============ -->
  <rect x="60" y="590" width="1385" height="120" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="752" y="618" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">03_run_md.sh — MD system build &amp; simulation (GROMACS, CHARMM36 + CGenFF)</text>
  <text x="752" y="642" font-size="12.5" text-anchor="middle" fill="#065f46">assemble topol.top → merge coordinates → solvate → neutralise (genion) → energy minimisation → NVT → NPT → 10 ns production MD</text>
  <text x="752" y="663" font-size="12" text-anchor="middle" fill="#065f46">Batch job via slurm/run_md.sh (module load gromacs/2024.3-mixed) on Setonix</text>
  <text x="752" y="686" font-size="11.5" font-style="italic" text-anchor="middle" fill="#047857">Validated end-to-end 2026-08-10: GSTA1-1 + GSH + lig_03506 ran clean through NVT/NPT; production confirmed at ~43 ns/day</text>

  <!-- ============ ROW F: POST-MD ANALYSIS ============ -->
  <rect x="60" y="724" width="1385" height="70" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="752" y="746" font-size="12.5" font-weight="700" text-anchor="middle" fill="#155e75">04_analyze_md.sh — post-MD QC &amp; analysis</text>
  <text x="752" y="763" font-size="12" text-anchor="middle" fill="#155e75">QC energies, RMSD/RMSF (protein / ligand / GSH), warhead–GSH-thiolate (SG2) distance</text>
  <text x="752" y="780" font-size="11.5" font-style="italic" text-anchor="middle" fill="#0e7490">plus a VMD (headless Tachyon) snapshot and rendered trajectory MP4</text>

  <!-- ============ ROW G: MM-PBSA RESCORING ============ -->
  <rect x="60" y="808" width="1385" height="88" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="752" y="830" font-size="12.5" font-weight="700" text-anchor="middle" fill="#155e75">05_run_mmpbsa.sh — MM-PBSA rescoring (gmx_MMPBSA, PB / CHARMM radii)</text>
  <text x="752" y="847" font-size="12" text-anchor="middle" fill="#155e75">Single-trajectory &#916;G_bind: Protein+GSH = receptor, ligand = UNL — enthalpic estimate (no entropy term)</text>
  <text x="752" y="864" font-size="11.5" font-style="italic" text-anchor="middle" fill="#047857">Validated 2026-08-14 on GSTA1-1 + lig_03506: 20-frame slice, 0 errors/warnings</text>
  <text x="752" y="881" font-size="11" text-anchor="middle" fill="#0e7490">Scaled via SLURM job array (run_mmpbsa_array.sh: per-chunk serial gmx_MMPBSA + merge_mmpbsa_chunks.py) — real MPI-parallel mode blocked by a GROMACS/mpi4py MPI-library mismatch on Setonix</text>

  <!-- ============ ARROWS: inputs -> row A ============ -->
  <line x1="250" y1="130" x2="230" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="130" x2="555" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="780" y1="130" x2="915" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1230" y1="130" x2="1260" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ARROWS: row A -> row B ============ -->
  <line x1="220" y1="250" x2="220" y2="264" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="250" x2="560" y2="264" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="920" y1="250" x2="920" y2="264" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1260" y1="250" x2="1260" y2="264" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ARROWS: row B -> row C ============ -->
  <line x1="390" y1="324" x2="390" y2="338" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1260" y1="324" x2="1260" y2="338" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ARROWS: row C -> row D ============ -->
  <line x1="390" y1="390" x2="390" y2="404" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ARROWS: row D -> row E ============ -->
  <line x1="390" y1="486" x2="390" y2="500" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ CROSSOVER: selected ligand -> CGenFF prep ============ -->
  <line x1="720" y1="534" x2="1095" y2="534" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="905" y="524" font-size="10.5" font-style="italic" text-anchor="middle" fill="#334155">which ligand won</text>

  <!-- ============ PROTEIN TOPOLOGY: R2 straight down to merge ============ -->
  <line x1="920" y1="324" x2="920" y2="588" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ GSH itp/prm: R5 routed around R6 to merge ============ -->
  <polyline points="1260,390 1260,400 1435,400 1435,588" fill="none" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ Ligand itp/prm: R6 straight down to merge ============ -->
  <line x1="1260" y1="566" x2="1260" y2="588" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ Merge -> Row F -> Row G ============ -->
  <line x1="752" y1="710" x2="752" y2="722" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="752" y1="794" x2="752" y2="806" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ NOTE: two tracks ============ -->
  <rect x="60" y="912" width="1385" height="50" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="752" y="932" font-size="11.5" font-style="italic" text-anchor="middle" fill="#713f12">Why two tracks: Vina treats the receptor as rigid and only needs empirical PDBQT atom types — no bonded parameters. GROMACS moves every</text>
  <text x="752" y="949" font-size="11.5" font-style="italic" text-anchor="middle" fill="#713f12">atom under real dynamics, so GSH and every ligand need a full CGenFF-derived force field first. The tracks only reconverge at system assembly.</text>

  <!-- ============ NOTE: reading the rescoring ============ -->
  <rect x="60" y="970" width="1385" height="50" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="752" y="990" font-size="11.5" font-style="italic" text-anchor="middle" fill="#713f12">Reading the rescoring: neither Vina's score nor MM-PBSA's &#916;G is a full Gibbs free energy (Vina is an empirical fit; MM-PBSA here omits</text>
  <text x="752" y="1007" font-size="11.5" font-style="italic" text-anchor="middle" fill="#713f12">the entropy term) — the two aren't directly comparable in magnitude. Use MM-PBSA to check whether Vina's relative ranking holds up.</text>

  <!-- ============ LEGEND ============ -->
  <rect x="60" y="1034" width="16" height="16" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="84" y="1047" font-size="12" fill="#334155">Docking pipeline step</text>

  <rect x="320" y="1034" width="16" height="16" rx="3" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="344" y="1047" font-size="12" fill="#334155">MD force-field prep step</text>

  <rect x="620" y="1034" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="644" y="1047" font-size="12" fill="#334155">MD system build / simulation</text>

  <rect x="920" y="1034" width="16" height="16" rx="3" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="944" y="1047" font-size="12" fill="#334155">Post-MD analysis / rescoring</text>
</svg>
